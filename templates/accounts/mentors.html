{% extends "base.html" %}{% block content %}<h1 class="display-6 fw-bold mb-4">Mentors</h1><div class="row g-3">{% for person in people %}<div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body"><h3 class="h5"><a href="{% url 'accounts:profile' person.username %}">{{ person.username }}</a></h3><p class="text-muted">{{ person.bio|default:"SkillSwap mentor" }}</p><span class="badge text-bg-light">{{ person.skill_offers.count }} offers</span></div></div></div>{% empty %}<p>No mentors yet.</p>{% endfor %}</div>{% endblock %}
