{% extends "base.html" %}{% block content %}<h1 class="display-6 fw-bold mb-4">Categories</h1><div class="row g-3">{% for category in categories %}<div class="col-sm-6 col-lg-4"><a class="category-tile" href="{% url 'offers:category_detail' category.slug %}"><span>{{ category.name }}</span><span class="text-muted">{{ category.offer_count }} offers →</span></a></div>{% empty %}<p>No categories yet. Add them in Django Admin.</p>{% endfor %}</div>{% endblock %}
